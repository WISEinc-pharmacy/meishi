<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>名刺管理 | ワイズ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%87%3C/text%3E%3C/svg%3E">
<style>
  :root{
    /* === ワイズ標準デザイントークン（design_system.md準拠＝白ベース＋青の差し色） === */
    --color-primary:#2563eb;        /* 青(blue-600)：白文字でWCAG AA。ボタン・アクション色 */
    --color-accent:#3b82f6;         /* 明るい青：アクセント */
    --color-navy:#1d4ed8;           /* ヘッダー帯・見出し・アクティブタブ（やや濃い青） */
    --color-navy-dark:#1e3a8a;      /* トースト等の濃紺 */
    --color-bg:#f8fafc;             /* ライトグレー背景 */
    --color-surface:#ffffff;        /* 白サーフェス */
    --color-text:#1e293b;
    --color-text-sub:#64748b;
    --color-border:#e2e8f0;
    --color-danger:#d0463b;
    --color-warn:#c9870a;
    --font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    --text-xs:.75rem; --text-sm:.875rem; --text-base:1rem; --text-lg:1.125rem; --text-xl:1.25rem; --text-2xl:1.5rem;
    --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px; --space-8:32px;
    --radius-sm:6px; --radius-md:10px; --radius-lg:12px; --radius-xl:16px; --radius-full:9999px;
    --shadow:0 1px 3px rgba(20,40,70,.08),0 1px 2px rgba(20,40,70,.06);
    /* 後方互換エイリアス（既存CSSが参照。値は上の標準トークンが源泉） */
    --navy:var(--color-navy); --navy-d:var(--color-navy-dark); --mint:var(--color-primary);
    --bg:var(--color-bg); --line:var(--color-border); --text:var(--color-text); --sub:var(--color-text-sub);
    --danger:var(--color-danger); --warn:var(--color-warn); --r:var(--radius-lg); --sh:var(--shadow);
  }
  *{box-sizing:border-box}
  :focus-visible{outline:3px solid var(--color-primary);outline-offset:2px;border-radius:4px}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%}
  header{background:var(--navy);color:#fff;padding:env(safe-area-inset-top) 0 0;position:sticky;top:0;z-index:20}
  .hbar{display:flex;align-items:center;gap:10px;padding:12px 16px}
  .hbar h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.02em}
  .hbar .sp{flex:1}
  .me{font-size:12px;opacity:.85;display:flex;align-items:center;gap:8px}
  .btn{appearance:none;border:0;border-radius:10px;padding:11px 16px;font-size:14px;font-weight:600;
    cursor:pointer;background:var(--mint);color:#fff;transition:.15s;line-height:1}
  .btn:active{transform:translateY(1px)}
  .btn[disabled]{opacity:.5;cursor:default}
  .btn.sec{background:#fff;color:var(--navy);border:1px solid var(--line)}
  .btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);padding:7px 12px;font-size:13px}
  .btn.danger{background:var(--danger)}
  .btn.sm{padding:7px 12px;font-size:13px}
  .wrap{max-width:980px;margin:0 auto;padding:16px;padding-bottom:90px}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
  .pad{padding:16px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  label.f{display:block;font-size:12px;color:var(--sub);margin:0 0 4px;font-weight:600}
  input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
    font-size:15px;font-family:inherit;background:#fff;color:var(--text)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--mint);outline-offset:-1px;border-color:transparent}
  textarea{resize:vertical;min-height:64px}
  .fg{margin-bottom:12px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:560px){.grid2{grid-template-columns:1fr}}
  .tabbar{display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px;position:sticky;top:54px;z-index:10}
  .tab{flex:1;text-align:center;padding:10px;border-radius:9px;font-size:13px;font-weight:600;color:var(--sub);cursor:pointer}
  .tab.on{background:var(--navy);color:#fff}
  .hidden{display:none!important}
  .center{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
  .drop{border:2px dashed var(--mint);border-radius:14px;padding:28px 16px;text-align:center;background:#fff;cursor:pointer}
  .drop .big{font-size:40px}
  .preview{max-width:100%;border-radius:12px;border:1px solid var(--line);display:block;margin:0 auto}
  .muted{color:var(--sub);font-size:13px}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:#eef2f7;color:var(--navy)}
  /* ステージ7値（①あいさつ/②決裁者面談/③統括商談/成約/取引開始/検討中/見送り）。
     クラス名は activity_payload.js の stageClass() が返すASCIIスラッグ */
  .st-s1{background:#eaf2ff;color:#2a5fb0}
  .st-s2{background:#fff3da;color:#9a6a00}
  .st-s3{background:#e9f6ff;color:#1f7fa6}
  .st-win{background:#e3f7ee;color:#1f8f5f}
  .st-act{background:#dff3e4;color:#17704a}
  .st-hold{background:#eef0f3;color:#5b6675}
  .st-lost{background:#fbe9e7;color:#b23b30}
  .st-none{background:#f1f5f9;color:#64748b}
  .list{display:grid;gap:10px}
  .item{display:flex;gap:12px;align-items:center;padding:12px;cursor:pointer}
  .item .thumb{width:52px;height:34px;border-radius:6px;object-fit:cover;background:#eef2f7;flex:none}
  .item .nm{font-weight:700;font-size:15px}
  .item .co{font-size:12px;color:var(--sub)}
  .item .sp{flex:1}
  .search{display:flex;gap:8px;margin-bottom:14px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy-d);color:#fff;
    padding:12px 18px;border-radius:10px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:50;max-width:90%}
  .banner{background:#fff7e6;border:1px solid #f0d68a;color:#7a5a00;border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:14px}
  .dupbox{background:#fbe9e7;border:1px solid #f0b8b0;color:#8a2c22;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
  .spin{width:34px;height:34px;border:3px solid #d8e0ea;border-top-color:var(--mint);border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .overlay{position:fixed;inset:0;background:rgba(20,30,45,.55);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
  .modal{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
  .fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:15}
  .fab .btn{box-shadow:0 6px 18px rgba(31,58,95,.35);padding:14px 20px;font-size:15px;border-radius:999px}
  .detail-img{width:100%;border-radius:10px;border:1px solid var(--line);margin-bottom:12px}
  .kv{display:flex;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
  .kv .k{width:96px;color:var(--sub);flex:none}
  .kv .v{flex:1;word-break:break-word}
  a{color:var(--navy)}
  /* 活動タブ（スマホ前提：縦並び・タップ領域は44px以上） */
  .filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .filters .wide{grid-column:1 / -1}
  .filters select,.filters input{padding:12px}
  .fitem{display:flex;gap:10px;align-items:center;padding:14px 12px;cursor:pointer}
  .fitem .nm{font-weight:700;font-size:15px}
  .fitem .sub{font-size:12px;color:var(--sub)}
  .act{border-bottom:1px solid var(--line);padding:10px 0;font-size:13px}
  .act:last-child{border-bottom:0}
  .act .hd{font-weight:700;font-size:13px}
  .act .bd{color:var(--sub);margin-top:3px;white-space:pre-wrap;word-break:break-word}
  .chk{display:flex;align-items:center;gap:10px;padding:11px 10px;border:1px solid var(--line);
    border-radius:10px;margin-bottom:8px;font-size:14px;cursor:pointer;background:#fff}
  .chk input{width:20px;height:20px;flex:none}
  .kindrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .kindrow label{display:block;text-align:center;padding:12px 4px;border:1px solid var(--line);
    border-radius:10px;font-size:14px;font-weight:600;color:var(--sub);background:#fff;cursor:pointer}
  .kindrow input{display:none}
  /* :has 非対応の古いブラウザでも選択が分かるように下線＋太字でフォールバック */
  .kindrow input:checked + span{font-weight:800;text-decoration:underline}
  .kindrow label:has(input:checked){background:var(--navy);border-color:var(--navy);color:#fff}
</style>
</head>
<body>
<header>
  <div class="hbar">
    <h1>名刺管理</h1>
    <div class="sp"></div>
    <div id="meBox" class="me hidden"><span id="meName"></span><span id="meRole" class="pill"></span>
      <button class="btn ghost" id="helpBtn">使い方</button>
      <button class="btn ghost hidden" id="keyBtn">AI読み取りキー</button>
      <button class="btn ghost hidden" id="permBtn">権限管理</button>
      <button class="btn ghost" id="logoutBtn">ログアウト</button></div>
  </div>
</header>

<!-- ログイン -->
<div id="loginView" class="center">
  <div style="font-size:48px">📇</div>
  <h2 style="margin:0">ワイズ 名刺管理</h2>
  <p class="muted">営業で共有する名刺台帳です。Googleアカウントでログインしてください。</p>
  <button class="btn" id="loginBtn">Googleでログイン</button>
  <p id="loginMsg" class="muted"></p>
</div>

<!-- アプリ -->
<div id="appView" class="wrap hidden">
  <div id="setupBanner" class="banner hidden"></div>
  <div class="tabbar">
    <div class="tab on" data-tab="capture">＋ 登録</div>
    <div class="tab" data-tab="list">一覧・検索</div>
    <div class="tab" data-tab="activity">活動</div>
  </div>

  <!-- 登録タブ -->
  <section id="tab-capture">
    <div class="card pad">
      <div id="captureStart">
        <div class="row" style="gap:10px;align-items:stretch">
          <label for="frontInput" class="drop" style="flex:1;min-width:0">
            <div class="big">📷</div>
            <div style="font-weight:700;margin-top:6px">表面 <span style="color:var(--mint)">*</span></div>
            <div class="muted" id="frontHint" style="margin-top:4px">タップで撮影/選択</div>
            <img id="frontPrev" class="hidden" style="max-height:90px;margin:8px auto 0;border-radius:8px;display:block" alt="">
          </label>
          <label for="backInput" class="drop" style="flex:1;min-width:0">
            <div class="big">🔄</div>
            <div style="font-weight:700;margin-top:6px">裏面（任意）</div>
            <div class="muted" id="backHint" style="margin-top:4px">英語面・QR等</div>
            <img id="backPrev" class="hidden" style="max-height:90px;margin:8px auto 0;border-radius:8px;display:block" alt="">
          </label>
        </div>
        <input id="frontInput" type="file" accept="image/*" capture="environment" class="hidden">
        <input id="backInput" type="file" accept="image/*" capture="environment" class="hidden">
        <button class="btn" id="readBtn" style="margin-top:14px;width:100%" disabled>AIで読み取って入力へ</button>
      </div>

      <div id="captureBusy" class="hidden center" style="min-height:auto;padding:30px">
        <div class="spin"></div>
        <div class="muted" id="busyMsg">AIが名刺を読み取っています…</div>
      </div>

      <!-- 確認・修正フォーム -->
      <form id="cardForm" class="hidden">
        <div class="row" style="gap:10px;margin-bottom:14px;align-items:flex-start">
          <div style="flex:1;min-width:0;text-align:center">
            <div class="muted" style="font-size:12px;margin-bottom:4px">表面</div>
            <img id="formPreview" class="preview" style="max-height:170px;object-fit:contain;background:#f0f3f7" alt="">
          </div>
          <div style="flex:1;min-width:0;text-align:center">
            <div class="muted" style="font-size:12px;margin-bottom:4px">裏面</div>
            <label for="formBackInput" style="display:block;cursor:pointer">
              <img id="formBackPreview" class="preview" style="max-height:170px;object-fit:contain;background:#f0f3f7;display:none" alt="">
              <span id="formBackEmpty" class="muted" style="display:flex;align-items:center;justify-content:center;height:90px;border:2px dashed var(--line);border-radius:12px;font-size:13px">＋ 裏面を追加</span>
            </label>
            <input id="formBackInput" type="file" accept="image/*" capture="environment" class="hidden">
          </div>
        </div>
        <div id="dupWarn" class="dupbox hidden"></div>
        <div class="grid2">
          <div class="fg"><label class="f">氏名 *</label><input name="name" required></div>
          <div class="fg"><label class="f">フリガナ</label><input name="kana"></div>
          <div class="fg"><label class="f">会社名 *</label><input name="company" required></div>
          <div class="fg"><label class="f">部署</label><input name="department"></div>
          <div class="fg"><label class="f">役職</label><input name="title"></div>
          <div class="fg"><label class="f">メール</label><input name="email" type="email"></div>
          <div class="fg"><label class="f">電話</label><input name="phone"></div>
          <div class="fg"><label class="f">携帯</label><input name="mobile"></div>
        </div>
        <div class="fg"><label class="f">住所</label><input name="address"></div>
        <div class="fg"><label class="f">URL</label><input name="url"></div>
        <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
        <!-- 施設の紐付け（任意）。未選択でも保存できる＝必須項目は 氏名・会社名 のまま
             値は facilities のドキュメントID＝施設名を正規化したもの（facilityKey）。
             施設IDは一意でない（同一電話の別棟で衝突・未取得9件は空）ため紐付けキーに使わない（追補2） -->
        <div class="fg"><label class="f">施設（任意・選ぶと活動記録と紐づきます）</label>
          <select name="facilityKey" id="cardFacility"><option value="">（未設定）</option></select></div>
        <div class="grid2">
          <!-- ステータス＝ステージ7値（2026-10-19 語彙統一）。
               旧値→新値の対応表は activity_payload.js の LEGACY_STATUS_MAP が正本：
                 初回接触→①あいさつ ／ 商談中→②決裁者面談 ／ 見積提出→③統括商談
                 受注→成約 ／ 失注→見送り ／ 保留→検討中
               既存データは書き換えていない。表示・編集時に normalizeStage() が読み替える。 -->
          <div class="fg"><label class="f">ステージ</label>
            <select name="status">
              <option>①あいさつ</option><option>②決裁者面談</option><option>③統括商談</option>
              <option>成約</option><option>取引開始</option><option>検討中</option><option>見送り</option>
            </select></div>
          <div class="fg"><label class="f">次アクション日</label><input name="nextActionDate" type="date"></div>
        </div>
        <div class="fg"><label class="f">メモ</label><textarea name="memo"></textarea></div>
        <div class="row" style="justify-content:flex-end;margin-top:6px">
          <button type="button" class="btn sec" id="cancelForm">キャンセル</button>
          <button type="submit" class="btn" id="saveBtn">保存する</button>
        </div>
      </form>
    </div>
  </section>

  <!-- 一覧タブ -->
  <section id="tab-list" class="hidden">
    <div class="search">
      <input id="searchBox" placeholder="会社名・氏名・部署で検索">
      <button class="btn sec sm" id="csvBtn">CSV出力</button>
    </div>
    <div id="listCount" class="muted" style="margin-bottom:8px"></div>
    <div id="listArea" class="list"></div>
  </section>

  <!-- 活動タブ（施設単位の営業活動記録・設計正本 wise/AI_sales_ren/DESIGN.md） -->
  <section id="tab-activity" class="hidden">
    <!-- 最近の記録。連〈れん〉の自動同期が動くまで、入力の確認と管理部の転記はここから行う -->
    <div class="card pad" style="margin-bottom:12px">
      <div class="row" style="justify-content:space-between;align-items:center;gap:8px">
        <h3 style="font-size:14px;margin:0">最近の記録</h3>
        <button class="btn sec sm" id="actCsvBtn" style="flex:none">商談ログ用CSV</button>
      </div>
      <div id="recentBox" class="muted" style="margin-top:10px">読み込み中…</div>
    </div>
    <div class="filters">
      <input id="facQ" class="wide" placeholder="施設名・電話で検索">
      <select id="facArea"><option value="">エリア：すべて</option></select>
      <select id="facType"><option value="">種別：すべて</option></select>
      <select id="facStage" class="wide"><option value="">ステージ：すべて</option></select>
    </div>
    <div id="facCount" class="muted" style="margin-bottom:8px"></div>
    <div id="facArea2" class="list"></div>
  </section>
</div>

<div id="detailMount"></div>
<div id="toastMount"></div>

<!-- Firebase compat SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<!-- 活動記録の語彙とペイロード組み立ての正本（Nodeのハーネス test_activity_payload.mjs と同じファイルを読む）。
     module は defer 相当で後から実行されるが、利用するのはユーザー操作後のハンドラ内なので間に合う。 -->
<script type="module">
  import * as ActivityPayload from './activity_payload.js';
  window.MeishiActivity = ActivityPayload;
  window.dispatchEvent(new Event('meishi-activity-ready'));
</script>

<script>
// ===== Firebase 設定（wise-meishi 専用プロジェクト）=====
// ↓ プロジェクト作成後に値を差し替える。未設定なら画面にセットアップ案内を表示。
const firebaseConfig = {
  apiKey: "AIzaSyAUqa6aUV2gqdNxAdmCWVxmbisaVb_tP18",
  authDomain: "wise-meishi.firebaseapp.com",
  projectId: "wise-meishi",
  storageBucket: "wise-meishi.firebasestorage.app",
  messagingSenderId: "306031554184",
  appId: "1:306031554184:web:05fb61369bf71255f9393d"
};
const CONFIGURED = !firebaseConfig.apiKey.startsWith("__");

const GEMINI_MODEL = "gemini-2.5-flash"; // Vision対応・低コスト

let auth, db, currentUser=null, userRole="viewer";
let geminiKey=null, cards=[], pendingFront=null, pendingBack=null, editingId=null;

const $ = s=>document.querySelector(s);
const esc = s=> (s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// 登録・編集・削除ができる権限（admin または editor）。権限管理・AIキー登録は admin のみ。
const canEdit = ()=> userRole==='admin' || userRole==='editor';

function toast(msg){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  $('#toastMount').appendChild(t);setTimeout(()=>t.remove(),2600);
}

// ===== 起動 =====
if(!CONFIGURED){
  $('#loginView').innerHTML =
   '<div style="font-size:48px">🛠️</div><h2>セットアップが必要です</h2>'+
   '<p class="muted" style="max-width:520px">Firebaseプロジェクト <b>wise-meishi</b> を作成し、'+
   'index.html の firebaseConfig に値を入れてデプロイすると利用できます。<br>'+
   'README の「セットアップ」を参照してください。</p>';
}else{
  firebase.initializeApp(firebaseConfig);
  auth=firebase.auth(); db=firebase.firestore();
  auth.onAuthStateChanged(onAuth);
  // ※ signInWithRedirect は使わない（GitHub Pages＋ストレージ分割ブラウザで
  //   "missing initial state" エラーになるため）。ログインはポップアップ方式に統一。
}

$('#loginBtn').onclick=async ()=>{
  $('#loginMsg').textContent='';
  const p=new firebase.auth.GoogleAuthProvider();
  try{
    await auth.signInWithPopup(p);
  }catch(e){
    // リダイレクト方式は GitHub Pages で壊れるため使わない。塞がれている場合は許可を促す。

async function saveKey(){
  const v=($('#keyInput').value||'').trim();
  const msg=$('#keyMsg');
  if(!v){ msg.textContent='キーを入力してください'; return; }
  // Geminiキーは AIza… (旧) と AQ.… (新) の2形式がある。空白なし・一定長を満たせば許可
  if(/\s/.test(v) || !/^[A-Za-z0-9_.\-]{20,}$/.test(v)){ msg.textContent='キーの形式が正しくないようです（余分な空白が混ざっていないか確認してください）'; return; }
  try{
    await db.collection('config').doc('gemini').set({apiKey:v,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
    geminiKey=v;
    $('#keyBtn').classList.add('hidden');   // 設定済みになったらボタンは隠す
    const b=$('#setupBanner'); b.textContent=''; b.classList.add('hidden');
    toast('AI読み取りキーを登録しました'); msg.textContent='登録しました。';
    setTimeout(()=>{ const ov=document.querySelector('.overlay'); if(ov) ov.remove(); }, 900);
  }catch(e){ msg.textContent='保存失敗: '+(e.code||e.message); }
}

async function pickSide(e,which){
  const file=e.target.files[0]; if(!file) return;
  if(!canEdit()){ toast('登録・編集ができるのは admin / editor のみです'); return; }
  const blob=await resizeImage(file,1280);
  const url=URL.createObjectURL(blob);
  if(which==='front'){ pendingFront=blob; setSlot('#frontPrev','#frontHint',url); }
  else{ pendingBack=blob; setSlot('#backPrev','#backHint',url); }
  $('#readBtn').disabled=!pendingFront;
  e.target.value='';
}
$('#frontInput').onchange=e=>pickSide(e,'front');
$('#backInput').onchange=e=>pickSide(e,'back');
function setSlot(imgSel,hintSel,url){ const im=$(imgSel); im.src=url; im.classList.remove('hidden'); $(hintSel).textContent='✓ 選択済み（タップで撮り直し）'; }
function resetStart(){

function show(state){

function resizeImage(file,max){
  return new Promise((res)=>{
    const img=new Image(); const u=URL.createObjectURL(file);
    img.onload=()=>{
      let{width:w,height:h}=img;
      if(w>max||h>max){ const r=Math.min(max/w,max/h); w=Math.round(w*r); h=Math.round(h*r); }
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(u);
      c.toBlob(b=>res(b),'image/jpeg',0.85);
    };
    img.src=u;
  });
}

function blobToBase64(blob){
  return new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(',')[1]); r.readAsDataURL(blob); });
}
// Blob → 指定サイズ・品質に縮小した JPEG dataURL（Firestore保存用）
function blobToResizedDataUrl(blob,max,quality){
  return new Promise(res=>{
    const img=new Image(); const u=URL.createObjectURL(blob);
    img.onload=()=>{ let{width:w,height:h}=img;
      if(w>max||h>max){const r=Math.min(max/w,max/h);w=Math.round(w*r);h=Math.round(h*r);}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(u);
      res(c.toDataURL('image/jpeg',quality));
    }; img.src=u; });
}

async function geminiExtract(front,back){
  const prompt=`名刺画像から情報を抽出し、JSONで返してください。読み取れない項目は空文字。
画像が2枚ある場合は「1枚目=表面・2枚目=裏面（英語表記や追加連絡先のことが多い）」です。両面の情報を統合し、日本語面を主としつつ裏面で不足を補ってください。
キー: name(氏名), kana(フリガナ), company(会社名), department(部署), title(役職), email, phone(固定/代表電話), mobile(携帯), address(住所), url(WebサイトURL)`;
  const parts=[{text:prompt},{inline_data:{mime_type:'image/jpeg',data:await blobToBase64(front)}}];
  if(back) parts.push({inline_data:{mime_type:'image/jpeg',data:await blobToBase64(back)}});
  const body={
    contents:[{parts}],
    generationConfig:{ responseMimeType:'application/json',
      responseSchema:{ type:'OBJECT', properties:{
        name:{type:'STRING'},kana:{type:'STRING'},company:{type:'STRING'},department:{type:'STRING'},
        title:{type:'STRING'},email:{type:'STRING'},phone:{type:'STRING'},mobile:{type:'STRING'},
        address:{type:'STRING'},url:{type:'STRING'} } } }
  };
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${geminiKey}`,
    {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok) throw new Error('Gemini '+r.status);
  const j=await r.json();
  const txt=j.candidates?.[0]?.content?.parts?.[0]?.text||'{}';
  return JSON.parse(txt);
}

function checkDup(name,company,email){
  const w=$('#dupWarn');
  const hits=cards.filter(c=>c.id!==editingId && (
     (email && c.email && c.email.toLowerCase()===email.toLowerCase()) ||
     (name && company && c.name===name && c.company===company)));
  if(hits.length){
    w.innerHTML='⚠️ 同じ名刺が既に登録されている可能性があります：<br>'+
      hits.slice(0,3).map(h=>'・'+esc(h.name)+'（'+esc(h.company)+'）').join('<br>');
    w.classList.remove('hidden');
  }else w.classList.add('hidden');
}

$('#cancelForm').onclick=()=>{ editingId=null; resetStart(); show('start'); };

$('#cardForm').onsubmit=async e=>{
  e.preventDefault();
  if(!canEdit()){ toast('登録・編集ができるのは admin / editor のみです'); return; }
  const f=e.target, btn=$('#saveBtn');
  btn.disabled=true; btn.textContent='保存中…';
  try{
    const rec={
      name:f.name.value.trim(), kana:f.kana.value.trim(), company:f.company.value.trim(),
      department:f.department.value.trim(), title:f.title.value.trim(), email:f.email.value.trim(),
      phone:f.phone.value.trim(), mobile:f.mobile.value.trim(), address:f.address.value.trim(),
      url:f.url.value.trim(), status:f.status.value, nextActionDate:f.nextActionDate.value, memo:f.memo.value.trim(),
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    };
    // 施設の紐付け（任意）。未選択なら空文字で保存＝必須項目は増やさない
    const fkey=f.facilityKey? f.facilityKey.value : '';
    const fac=fkey? (facilities.find(x=>facKey(x)===fkey)||{}) : {};
    rec.facilityKey=fkey;
    rec.facilityName=fkey? (fac.name||fkey) : '';
    rec.facilityId=fkey? (fac.facilityId||'') : '';   // 表示用の属性（一意ではない）
    // 表面：新規撮影時のみサムネ・原本を作る（編集で撮り直さなければ既存を保持）
    let frontFull=null, backFull=null;
    if(pendingFront){
      rec.thumb=await blobToResizedDataUrl(pendingFront,220,0.6);   // 一覧用の軽いサムネ(~10KB)
      frontFull=await blobToResizedDataUrl(pendingFront,1024,0.78); // 詳細用の原本(1MB制限内)
      rec.hasImage=true;
    }
    if(pendingBack){ backFull=await blobToResizedDataUrl(pendingBack,1024,0.78); rec.hasBack=true; }
    let id=editingId;
    if(id){ await db.collection('cards').doc(id).update(rec); }
    else{
      rec.createdBy=currentUser.uid; rec.createdByName=currentUser.displayName||currentUser.email;
      rec.createdAt=firebase.firestore.FieldValue.serverTimestamp();
      const ref=await db.collection('cards').add(rec); id=ref.id;
    }
    // 原本は別コレクションに分離（一覧クエリを軽く保つ）。merge:true で表/裏の片方更新時に他方を消さない
    const imgUpd={};
    if(frontFull) imgUpd.image=frontFull;
    if(backFull) imgUpd.imageBack=backFull;
    if(Object.keys(imgUpd).length){
      imgUpd.updatedAt=firebase.firestore.FieldValue.serverTimestamp();
      await db.collection('cardImages').doc(id).set(imgUpd,{merge:true});
    }
    resetStart(); editingId=null;
    await loadCards();
    show('start');
    toast('保存しました');
    document.querySelector('.tab[data-tab="list"]').click();
  }catch(err){ console.error(err); toast('保存失敗: '+err.message); }
  finally{ btn.disabled=false; btn.textContent='保存する'; }
};

    <div class="row" style="align-items:center"><h2 style="margin:0;flex:1">${esc(c.name||'')}</h2>
      <span class="pill ${stageCls(c.status)}">${esc(stageLabel(c.status))}</span></div>

    ${c.hasBack?`<img class="detail-img" id="detailImgBack" src="" alt="裏面">`:''}
    ${kv('部署',c.department)}${kv('役職',c.title)}
    ${kv('メール',c.email,c.email?'mailto:'+c.email:'')}
    ${kv('電話',c.phone,c.phone?'tel:'+c.phone:'')}
    ${kv('携帯',c.mobile,c.mobile?'tel:'+c.mobile:'')}
    ${kv('住所',c.address)}${kv('URL',c.url,c.url)}
    ${kv('次アクション',c.nextActionDate)}${kv('メモ',c.memo)}
    ${kv('登録者',c.createdByName)}
    <div class="row" style="justify-content:flex-end;margin-top:16px">
      <button class="btn sec" onclick="this.closest('.overlay').remove()">閉じる</button>
      ${editable?`<button class="btn" onclick="editCard('${c.id}')">編集</button>`:''}
      ${editable?`<button class="btn danger" onclick="delCard('${c.id}')">削除</button>`:''}
    </div></div>`;
  $('#detailMount').appendChild(m);
  // 原本画像（表/裏）は別コレクションから遅延ロードしてサムネと差し替え

    db.collection('cardImages').doc(c.id).get().then(d=>{
      if(!d.exists) return; const data=d.data();

      const eb=m.querySelector('#detailImgBack'); if(eb && data.imageBack) eb.src=data.imageBack;
    }).catch(()=>{});
  }
};

window.editCard=function(id){
  const c=cards.find(x=>x.id===id); if(!c) return;
  document.querySelectorAll('.overlay').forEach(o=>o.remove());
  pendingFront=null; pendingBack=null;
  openForm(c,c.thumb,id,'');
  // 裏面の原本を読み込んでプレビュー表示（撮り直さなければ保存時も保持）
  if(c.hasBack){
    db.collection('cardImages').doc(id).get().then(d=>{
      if(d.exists && d.data().imageBack) setFormBack(d.data().imageBack);
    }).catch(()=>{});
  }
};

window.delCard=async function(id){
  if(!confirm('この名刺を削除しますか？')) return;
  try{
    try{ await db.collection('cardImages').doc(id).delete(); }catch(e){}
    await db.collection('cards').doc(id).delete();
    document.querySelectorAll('.overlay').forEach(o=>o.remove());
    await loadCards(); toast('削除しました');
  }catch(e){ toast('削除失敗: '+e.message); }
};

//   facilities は連〈れん〉がAdmin SDKで片方向に書くミラー（アプリは読むだけ）。

let facilities=[], facLoaded=false;

// activity_payload.js（module）の関数へのアクセサ。module は後から読み込まれるため都度参照する。
const MA = ()=> window.MeishiActivity || null;
function stageLabel(v){ const m=MA(); if(m) return m.normalizeStage(v);
  const s=(v==null?'':String(v)).trim(); return STAGE_FALLBACK.includes(s)? s : STAGE_FALLBACK[0]; }
function stageCls(v){ const m=MA(); return m? m.stageClass(v) : 'st-s1'; }
const STAGE_FALLBACK=['①あいさつ','②決裁者面談','③統括商談','成約','取引開始','検討中','見送り'];
const KIND_FALLBACK=['訪問','電話','同行','メール','資料送付','その他'];
const stageList = ()=> (MA()? MA().STAGES : STAGE_FALLBACK);
// 施設キー＝施設名を正規化したもの（facilities のドキュメントID）。正規化は activity_payload.js が正本
const facKey = f => { const m=MA(); const n=(f&&(f.name||f.id))||''; return m? m.facilityKeyOf(n) : String(n).trim().replace(/\//g,'／'); };
// 施設台帳のステージは空が30件ある（2026-10-19実測）。名刺と違い空は空のまま「未設定」と出す
const facStageLabel = v => (String(v||'').trim()? stageLabel(v) : '未設定');
const facStageCls   = v => (String(v||'').trim()? stageCls(v) : 'st-none');
const kindList  = ()=> (MA()? MA().ACTIVITY_KINDS : KIND_FALLBACK);

async function openActivityTab(){
  if(!facLoaded){ await loadFacilities(); }
  renderFacilities();
  renderRecent();
}

async function loadFacilities(){
  try{
    const qs=await db.collection('facilities').get();
    facilities=qs.docs.map(d=>({id:d.id,...d.data()}));
    facilities.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ja'));
    facLoaded=true;
    fillFacilityFilters();
    fillCardFacilitySelect();
  }catch(e){
    facilities=[]; facLoaded=false;
    $('#facArea2').innerHTML='<div class="muted" style="padding:24px;text-align:center">施設リストの取得に失敗しました（'+esc(e.code||e.message)+'）</div>';
  }
}

function fillFacilityFilters(){
  const uniq=k=>[...new Set(facilities.map(f=>(f[k]||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
  const set=(sel,label,vals)=>{
    const el=$(sel), cur=el.value;
    el.innerHTML='<option value="">'+label+'：すべて</option>'+vals.map(v=>`<option>${esc(v)}</option>`).join('');
    el.value=cur;
  };
  set('#facArea','エリア',uniq('area'));
  set('#facType','種別',uniq('type'));
  set('#facStage','ステージ',[...stageList(),'未設定']);
}

function fillCardFacilitySelect(){
  const el=$('#cardFacility'); if(!el) return;
  const cur=el.value;
  el.innerHTML='<option value="">（未設定）</option>'+
    facilities.map(f=>`<option value="${esc(facKey(f))}">${esc(f.name||f.id)}</option>`).join('');
  el.value=cur;
}

['#facQ','#facArea','#facType','#facStage'].forEach(s=>{
  const el=$(s); if(el) el.addEventListener('input',renderFacilities);
});

function renderFacilities(){
  const area=$('#facArea2');
  if(!facilities.length){
    $('#facCount').textContent='';
    area.innerHTML='<div class="muted" style="padding:24px;text-align:center">施設リストはまだ同期されていません</div>';
    return;
  }
  const q=$('#facQ').value.trim().toLowerCase();
  const fa=$('#facArea').value, ft=$('#facType').value, fs=$('#facStage').value;
  const hit=facilities.filter(f=>{
    if(q && ![f.name,f.tel].some(v=>(v||'').toLowerCase().includes(q))) return false;
    if(fa && (f.area||'')!==fa) return false;
    if(ft && (f.type||'')!==ft) return false;
    if(fs && facStageLabel(f.stage)!==fs) return false;
    return true;
  });
  $('#facCount').textContent=`全 ${facilities.length} 施設`+((q||fa||ft||fs)?`（${hit.length} 件ヒット）`:'');
  if(!hit.length){ area.innerHTML='<div class="muted" style="padding:24px;text-align:center">該当する施設がありません</div>'; return; }
  area.innerHTML=hit.map(f=>`
    <div class="card fitem" onclick="openFacility('${esc(f.id)}')">
      <div style="min-width:0">
        <div class="nm">${esc(f.name||'(名称未設定)')}</div>
        <div class="sub">${esc(f.area||'')}${f.type?' / '+esc(f.type):''}${f.tel?' / '+esc(f.tel):''}</div>
      </div>
      <div class="sp" style="flex:1"></div>
      <span class="pill ${facStageCls(f.stage)}">${esc(facStageLabel(f.stage))}</span>
    </div>`).join('');
}

async function fetchActivities(fkey){
  // 複合インデックス(facilityKey,date desc)が未作成でも動くように、失敗したら手元で並べ替える
  try{
    const qs=await db.collection('activities').where('facilityKey','==',fkey).orderBy('date','desc').limit(20).get();
    return qs.docs.map(d=>({id:d.id,...d.data()}));
  }catch(e){
    const qs=await db.collection('activities').where('facilityKey','==',fkey).get();
    return qs.docs.map(d=>({id:d.id,...d.data()}))
      .sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).slice(0,20);
  }
}

async function renderActivityHistory(fkey,box){
  if(!box) return;
  try{
    const rows=await fetchActivities(fkey);
    if(!rows.length){ box.innerHTML='<p class="muted" style="margin:0">活動記録はまだありません</p>'; return; }
    box.classList.remove('muted');
    box.innerHTML=rows.map(a=>{
      const who=(a.attendees||[]).map(p=>p.name).filter(Boolean).join('・');
      const sync=a.syncState&&a.syncState.status==='synced'?'同期済':(a.syncState&&a.syncState.status==='failed'?'同期失敗':'同期待ち');
      return `<div class="act">
        <div class="hd">${esc(a.date||'')}　${esc(a.kind||'')}　<span class="pill ${stageCls(a.stage)}">${esc(stageLabel(a.stage))}</span></div>
        <div class="bd">${who?'相手：'+esc(who)+'\n':''}${a.memo?esc(a.memo)+'\n':''}${a.nextAction?'次：'+esc(a.nextAction)+(a.nextActionDate?'（'+esc(a.nextActionDate)+'）':''):''}</div>
        <div class="bd" style="font-size:11px">${esc((a.createdBy&&a.createdBy.name)||'')} / ${esc(sync)}</div>
      </div>`;
    }).join('');
  }catch(e){ box.textContent='活動履歴の取得に失敗しました（'+(e.code||e.message)+'）'; }
}

  const m=document.createElement('div'); m.className='overlay'; m.onclick=e=>{if(e.target===m)m.remove();};
  m.innerHTML=`<div class="modal pad">
    <h2 style="margin:0 0 2px;font-size:18px">活動を記録</h2>
    <p class="muted" style="margin:0 0 14px">${esc(f.name||'')}</p>
    <form id="actForm" data-fkey="${esc(fkey)}" data-fname="${esc(f.name||'')}" data-fid="${esc(f.facilityId||'')}">
      <div class="fg"><label class="f">日付</label><input name="date" type="date" value="${iso}" required></div>
      <div class="fg"><label class="f">種別</label>
        <div class="kindrow">${kindList().map((k,i)=>
          `<label><input type="radio" name="kind" value="${esc(k)}"${i===0?' checked':''}><span>${esc(k)}</span></label>`).join('')}</div></div>
      <div class="fg"><label class="f">会った人（0人でも保存できます）</label>
        ${mine.length? mine.map(c=>
          `<label class="chk"><input type="checkbox" class="att" value="${esc(c.id)}" data-name="${esc(c.name||'')}" data-title="${esc(c.title||'')}">
            <span>${esc(c.name||'(無名)')}${c.title?' <span class="muted">'+esc(c.title)+'</span>':''}</span></label>`).join('')
          : '<p class="muted" style="margin:0 0 8px">この施設に紐づく名刺はまだありません</p>'}
        <div id="manualBox"></div>
        <button type="button" class="btn sec sm" id="addManual" style="width:100%">＋ 名刺に無い人を追加</button>
      </div>
      <div class="fg"><label class="f">ステージ</label>
        <select name="stage">${stageList().map(s=>`<option${stageLabel(f.stage)===s?' selected':''}>${esc(s)}</option>`).join('')}</select></div>
      <!-- 施設台帳のステージが空の施設（実測30件）は既定で ①あいさつ が選ばれる -->
      <div class="fg"><label class="f">次アクション</label><input name="nextAction" placeholder="例：来週あらためて管理者へ説明"></div>
      <div class="fg"><label class="f">次アクション期日</label><input name="nextActionDate" type="date"></div>
      <div class="fg"><label class="f">メモ</label><textarea name="memo" placeholder="話した内容・相手の反応など"></textarea></div>
      <div id="actErr" class="dupbox hidden"></div>
      <div class="row" style="gap:8px;margin-top:6px">
        <button type="button" class="btn sec" style="flex:1" onclick="this.closest('.overlay').remove()">キャンセル</button>
        <button type="submit" class="btn" style="flex:2" id="actSave">保存する</button>
      </div>
    </form></div>`;
  $('#detailMount').appendChild(m);
  m.querySelector('#addManual').onclick=()=>{
    manualRows++;
    const d=document.createElement('div'); d.className='grid2'; d.style.marginBottom='8px';
    d.innerHTML=`<input class="mname" placeholder="氏名"><input class="mtitle" placeholder="役職（任意）">`;
    m.querySelector('#manualBox').appendChild(d);
  };
  m.querySelector('#actForm').onsubmit=e=>saveActivity(e,m);
};

async function saveActivity(e,overlay){
  e.preventDefault();
  const form=e.target, btn=overlay.querySelector('#actSave'), err=overlay.querySelector('#actErr');
  err.classList.add('hidden');
  const api=MA();
  if(!api){ err.textContent='読み込みが完了していません。画面を再読み込みしてからもう一度お試しください。'; err.classList.remove('hidden'); return; }
  const attendees=[
    ...[...overlay.querySelectorAll('.att:checked')].map(c=>({cardId:c.value,name:c.dataset.name,title:c.dataset.title})),
    ...[...overlay.querySelectorAll('#manualBox .grid2')].map(r=>({
      name:r.querySelector('.mname').value, title:r.querySelector('.mtitle').value }))
  ];
  let payload;
  try{
    payload=api.buildActivityPayload({
      facilityKey:form.dataset.fkey, facilityName:form.dataset.fname, facilityId:form.dataset.fid,
      date:form.date.value, kind:(form.querySelector('input[name=kind]:checked')||{}).value,
      attendees, stage:form.stage.value,
      nextAction:form.nextAction.value, nextActionDate:form.nextActionDate.value, memo:form.memo.value,
      user:{email:currentUser.email,name:currentUser.displayName||currentUser.email}
    },{serverTimestamp:()=>firebase.firestore.FieldValue.serverTimestamp()});
  }catch(ex){ err.textContent=ex.message; err.classList.remove('hidden'); return; }
  btn.disabled=true; btn.textContent='保存中…';
  try{
    await db.collection('activities').add(payload);
    overlay.remove();
    document.querySelectorAll('.overlay').forEach(o=>o.remove());
    toast('活動を記録しました');
    renderRecent();
  }catch(ex){
    err.textContent='保存失敗: '+(ex.code||ex.message); err.classList.remove('hidden');
  }finally{ btn.disabled=false; btn.textContent='保存する'; }
}

// ===== 最近の記録（施設をまたいだ一覧）=====
// 連〈れん〉が動くまでは、営業は自分の入力が入ったかをここで確かめ、管理部はここから商談ログへ転記する。
// 並べ替えは createdAt の単一フィールド（複合インデックス不要）。失敗したら手元で並べ替える。
async function fetchRecent(limit){
  try{
    const qs=await db.collection('activities').orderBy('createdAt','desc').limit(limit).get();
    return qs.docs.map(d=>({id:d.id,...d.data()}));
  }catch(e){
    const qs=await db.collection('activities').limit(500).get();
    return qs.docs.map(d=>({id:d.id,...d.data()}))
      .sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).slice(0,limit);
  }
}

async function renderRecent(){
  const box=$('#recentBox'); if(!box) return;
  box.className='muted'; box.textContent='読み込み中…';
  try{
    const rows=await fetchRecent(20);
    if(!rows.length){ box.textContent='まだ記録がありません'; return; }
    box.className='';
    box.innerHTML=rows.map(a=>{
      const who=(a.attendees||[]).map(p=>p.name).filter(Boolean).join('・');
      return `<div class="act">
        <div class="hd">${esc(a.date||'')}　${esc(a.facilityName||'')}　${esc(a.kind||'')}</div>
        <div class="bd">${who?'相手：'+esc(who)+'\n':''}${a.memo?esc(a.memo)+'\n':''}${a.nextAction?'次：'+esc(a.nextAction)+(a.nextActionDate?'（'+esc(a.nextActionDate)+'）':''):''}</div>
        <div class="bd" style="font-size:11px">${esc((a.createdBy&&a.createdBy.name)||'')}</div>
      </div>`;
    }).join('');
  }catch(e){ box.className='muted'; box.textContent='最近の記録の取得に失敗しました（'+(e.code||e.message)+'）'; }
}

// 商談ログの列順（日付・施設名・種別・相手・内容・次アクション・担当）で出す。
// B列=施設IDは施設名から引く数式なので出さない。日付をA列へ、施設名以降をC列へ貼る。
$('#actCsvBtn').onclick=async()=>{
  const btn=$('#actCsvBtn'); btn.disabled=true; btn.textContent='作成中…';
  try{
    const rows=await fetchRecent(500);
    if(!rows.length){ toast('まだ記録がありません'); return; }
    const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
    const line=a=>[a.date||'', a.facilityName||'', a.kind||'',
      (a.attendees||[]).map(p=>[p.name,p.title].filter(Boolean).join('/')).filter(Boolean).join('・'),
      a.memo||'',
      (a.nextAction||'')+(a.nextActionDate?'（'+a.nextActionDate+'）':''),
      (a.createdBy&&a.createdBy.name)||''].map(q).join(',');
    const out=[['日付','施設名','種別','相手','内容','次アクション','担当'].map(q).join(',')]
      .concat(rows.slice().sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))).map(line));
    const blob=new Blob(['﻿'+out.join('\r\n')],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='shodan_'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
  }catch(e){ toast('CSVの作成に失敗しました（'+(e.code||e.message)+'）'); }
  finally{ btn.disabled=false; btn.textContent='商談ログ用CSV'; }
};

// ===== CSV出力 =====
$('#csvBtn').onclick=()=>{
  if(!cards.length){ toast('データがありません'); return; }
  const cols=[['name','氏名'],['kana','フリガナ'],['company','会社名'],['department','部署'],['title','役職'],
    ['email','メール'],['phone','電話'],['mobile','携帯'],['address','住所'],['url','URL'],
    ['status','ステータス'],['nextActionDate','次アクション日'],['memo','メモ'],['createdByName','登録者']];
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const rows=[cols.map(c=>q(c[1])).join(',')];
  cards.forEach(c=>rows.push(cols.map(col=>q(c[col[0]])).join(',')));
  const blob=new Blob(['﻿'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='meishi_'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
};
</script>
